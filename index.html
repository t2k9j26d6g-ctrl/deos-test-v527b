<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DEOS V5</title>
  <link rel="stylesheet" href="style.css?v=530O" />

  <style>
    /* V5.24D — iPad/Safari : conserver la correction du débordement horizontal de la barre latérale. */
    .sidebar { overflow-x: hidden !important; }
    .sidebar * { max-width: 100%; box-sizing: border-box; }

    /* V5.26A — Paramètres en accordéons, état mémorisé par appareil. */
    .settings-card[data-settings-accordion-ready="1"] {
      padding-top: 0;
      overflow: hidden;
    }
    .settings-accordion-toggle {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 4px 14px;
      font: inherit;
      cursor: pointer;
      text-align: left;
    }
    .settings-accordion-title {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.25;
    }
    .settings-accordion-chevron {
      flex: 0 0 auto;
      min-width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(127,127,127,.12);
      font-weight: 800;
    }
    .settings-accordion-body {
      padding-top: 2px;
    }
    .settings-accordion-body[hidden] {
      display: none !important;
    }
    .settings-accordion-source-title {
      display: none !important;
    }
    .settings-card[data-settings-accordion-ready="1"].is-open .settings-accordion-toggle {
      border-bottom: 1px solid rgba(127,127,127,.16);
      margin-bottom: 14px;
    }
    @media (max-width: 900px) {
      .settings-accordion-toggle {
        padding: 16px 2px 12px;
      }
      .settings-accordion-title {
        font-size: 1rem;
      }
    }

  </style>
</head>

<body>
  <aside class="sidebar">
    <div class="brand">
      <div id="brandLogo" class="logo">D</div>
      <div>
        <strong id="brandAppName">DEOS</strong>
        <span id="brandSiteName">Saint-Gilles</span>
      </div>
    </div>
    <div id="brandVersion" class="version-chip" aria-label="Version de l'application"></div>
    <div id="brandEnvironment" class="environment-chip" hidden></div>

    <div class="sidebar-nav" aria-label="Navigation principale">
      <button class="nav active" data-view="cockpit">🏠 Cockpit</button>
      <button class="nav" data-view="graph">🕸️ Vue graphique</button>
      <button class="nav" data-view="folders">⭐ Dossiers</button>
      <button class="nav" data-view="projects">📁 Projets</button>
      <button class="nav" data-view="actions">✅ Actions</button>
      <button class="nav" data-view="decisions">📌 Décisions</button>
      <button class="nav" data-view="performance">📊 Performance</button>
      <button class="nav" data-view="priorities">🎯 Priorités / To-Do</button>
      <button class="nav" data-view="managers">👥 Managers</button>
      <button class="nav" data-view="journal">📝 Journal opérationnel</button>
      <button class="nav" data-view="documents">📄 Documents</button>
      <button class="nav" data-view="links">🔗 Liens</button>
      <button class="nav nav-settings" data-view="settings">⚙️ Paramètres</button>
      <button class="nav" data-view="activity">🕘 Agenda / Réunions</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-date">
        <p id="today" class="today"></p>
      </div>
      <h1 id="viewTitle">Cockpit décisionnel</h1>
      <input id="searchInput" type="search" placeholder="Rechercher : chocolat, Ludovic, CSE..." />
    </header>

    <section id="app"></section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="libs/jszip.js?v=132"></script>
  <script src="libs/xlsx.full.min.js"></script>
 <script src="config.js?v=530O"></script>
  <script src="supabase-client.js?v=530O"></script>
  <script src="remote-adapter.js?v=530O"></script>
  <script src="app.js?v=530O"></script>
</body>
</html>
